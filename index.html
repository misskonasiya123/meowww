    <title> Cats for you koomehhh ❤️</title>
    <style>
        body {
            font-family: 'Pacifico', cursive;
            background-color: #fff0f5;
            color: #ff69b4;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: relative;
        }
        header {
            background-color: #ff6f61;
            padding: 20px;
            color: white;
        }
        h1 {
            font-size: 3em;
            margin: 0;
        }
        .message {
            margin: 20px;
            font-size: 1.5em;
            min-height: 50px;
        }
        button {
            background-color: #ff6f61;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Pacifico', cursive;
        }
        .gallery {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
            display: flex; /* Added */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
          }
        .gallery img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .gallery img.active {
            opacity: 1;
        }
        .love-letter {
            position: relative;
            display: inline-block;
            cursor: pointer;
            margin-top: 20px;
        }
        .love-letter img {
            width: 150px;
        }
        .letter-content {
            display: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            color: #ff6f61;
            font-size: 1.2em;
        }
        .floating-heart {
            position: absolute;
            font-size: 30px;
            color: red;
            animation: floatUp 2s linear forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
        .sparkle {
            position: fixed;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 10%, rgba(255,255,255,0) 60%);
            animation: sparkleEffect 3s infinite alternate ease-in-out;
        }
        @keyframes sparkleEffect {
            0% { opacity: 0.2; }
            100% { opacity: 0.5; }
        }
        .countdown {
            font-size: 1.2em;
            margin-top: 20px;
            color: #ff6f61;
        }
    </style>

    <!-- Love Letter -->
    <div class="love-letter" onclick="openLetter()">
        <img src="envelope.png" alt="Love Letter">
        <div class="letter-content" id="letterContent">
            <p>My love, every day with you is a dream come true. ❤️</p>
        </div>
    </div>

    <!-- Countdown Timer -->
    <div class="countdown" id="countdown">Loading...</div>

    <footer>
        <p>Created with love by [Your Name] ❤️</p>
    </footer>

    <div class="sparkle"></div>

    <script>
        // Typing Effect
        const message = "meowwww meowwwww meowwwwwwww💖";
        let i = 0;
        function typeMessage() {
            if (i < message.length) {
                document.getElementById("typedMessage").innerHTML += message.charAt(i);
                i++;
                setTimeout(typeMessage, 100);
            }
        }
        typeMessage();

        // Reveal Hidden Message
        function revealMessage() {
            alert("I love you more than words can express. 🌹");
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // Love Letter Animation
        function openLetter() {
            document.getElementById("letterContent").style.display = "block";
        }

        // Slideshow
        let currentIndex = 0;
        function showNextImage() {
            const images = document.querySelectorAll(".gallery img");
            images[currentIndex].classList.remove("active");
            currentIndex = (currentIndex + 1) % images.length;
            images[currentIndex].classList.add("active");
        }
        setInterval(showNextImage, 3000);

        // Floating Hearts on Click
        document.addEventListener("click", function (event) {
            const heart = document.createElement("div");
            heart.classList.add("floating-heart");
            heart.innerHTML = "❤️";
            heart.style.left = `${event.clientX}px`;
            heart.style.top = `${event.clientY}px`;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 2000);
        });

        // Love Countdown Timer (Real-Time Update)
        function updateCountdown() {
            const startDate = new Date("2023-02-14"); // Change this to your real anniversary date
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerText = `We've been in love for ${days} days, ${hours} hours, ${minutes} minutes, and ${seconds} seconds! 💕`;
        }

        // Update every second
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Fireworks on Special Word
        document.addEventListener("keydown", function (event) {
            if (event.key.toLowerCase() === "l") { // Trigger fireworks on pressing "L"
                confetti({
                    particleCount: 300,
                    spread: 180,
                    origin: { y: 0.5 }
                });
            }
        });

    </script>
